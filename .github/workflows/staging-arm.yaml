name: Staging-ARM

on:
  push:
    branches:
      - "mistress"

env:
  COMPONENT: embed-text
  VERSION: latest
  CHART_VERSION: 0.0.0

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v2

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.12.0

      - name: Helm Lint
        run: |
          helm lint helm/${COMPONENT}

      - name: Helm Package
        run: |
          helm dependency update helm/${COMPONENT}
          helm package helm/${COMPONENT}

      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}

      - name: Helm Upgrade
        run: |
          helm upgrade --install ${COMPONENT} ${COMPONENT}-0.0.0.tgz \
            --set-string podAnnotations.commit=$(git rev-parse --short HEAD) \
            --values helm/${COMPONENT}/values-arm.yaml
