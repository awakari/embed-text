# Default values for auth.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/awakari/auth
  pullPolicy: Always
  tag: "latest"
imagePullSecrets:
  - name: github-registry
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 50051

ingress:
  enabled: false
  hosts:
    - host: embed-text.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: secret-auth-tls-server
      hosts:
        - auth.local

resources:
  requests:
    cpu: 1m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationValue: 100m
  targetMemoryUtilizationValue: 64Mi

priority:
  class: "awk-critical"

nodeSelector: {}

tolerations: []

log:
  # https://pkg.go.dev/golang.org/x/exp/slog#Level
  level: -4
model:
  path: "/model"
  name: "sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2"
  file:
    name: "model.onnx"
