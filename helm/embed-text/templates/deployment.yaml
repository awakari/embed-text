apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embed-text.fullname" . }}
  labels:
    {{- include "embed-text.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "embed-text.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "embed-text.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "embed-text.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      priorityClassName: "{{ .Values.priority.class }}"
      containers:
        - name: {{ .Chart.Name }}
          env:
            - name: API_PORT
              value: "{{ .Values.service.port }}"
            - name: LOG_LEVEL
              value: "{{ .Values.log.level }}"
            - name: MODEL_PATH
              value: "{{ .Values.model.path }}"
            - name: MODEL_NAME
              value: "{{ .Values.model.name }}"
            - name: MODEL_FILE_NAME
              value: "{{ .Values.model.file.name }}"
            - name: MODEL_CHUNK_SIZE
              value: "{{ .Values.model.chunk.size }}"
            - name: MODEL_CHUNK_OVERLAP
              value: "{{ .Values.model.chunk.overlap }}"
            - name: MODEL_INTRA_OP_THREADS_ENABLED
              value: "{{ .Values.model.intraOpThreads.enabled }}"
            - name: MODEL_INTRA_OP_THREADS_NUM
              value: "{{ .Values.model.intraOpThreads.num }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            timeoutSeconds: 100
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            timeoutSeconds: 100
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - {{ include "embed-text.name" . }}
                      - scylla
              topologyKey: "kubernetes.io/hostname"
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
